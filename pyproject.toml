[project]
name = "helpdesk-rag-starter"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "numpy>=2,<3",
  "chromadb>=1.5,<2",
]

[project.optional-dependencies]
local-embedding = ["sentence-transformers>=3,<6"]
watsonx = ["ibm-watsonx-ai>=1.7.2,<2"]
# IBM Cloud側がMilvus 2.6の場合の例。実際のserver major/minorに合わせる。
milvus = ["pymilvus>=2.6,<2.7"]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/helpdesk"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "N"]
ignore = [
  "S101",   # assert は test で使う
  "B008",   # FastAPI の Depends() は argument defaults での呼び出しが正規パターン
  "S311",   # jitter 用 random は cryptographic 用途でない
  "N818",   # _ServiceUnavailable は既存の命名規則
  "E501",   # 行長は既存コードで許容
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101"]
"backend/scripts/**" = ["E402", "B007", "B905"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.mypy]
strict = true
python_version = "3.14"
